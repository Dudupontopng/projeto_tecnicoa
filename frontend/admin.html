<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Administrador | Ponte Alimentar</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo">
    <div class="topo-conteudo">
      <span class="marca">Ponte Alimentar</span>
      <div class="topo-usuario">
        <span id="nome-usuario"></span>
        <button class="btn btn-sec btn-peq" id="btn-sair" type="button">Sair</button>
      </div>
    </div>
  </header>

  <main>
    <div class="resumo" id="resumo"></div>

    <div class="abas">
      <button class="aba ativa" type="button" data-alvo="instituicoes">Instituições</button>
      <button class="aba" type="button" data-alvo="doacoes">Doações</button>
      <button class="aba" type="button" data-alvo="categorias">Categorias</button>
      <button class="aba" type="button" data-alvo="usuarios">Usuários</button>
    </div>

    <section data-secao="instituicoes" class="painel">
      <h2>Instituições cadastradas</h2>
      <div class="filtros">
        <div>
          <label for="filtro-inst">Status</label>
          <select id="filtro-inst">
            <option value="pendente">Pendentes</option>
            <option value="aprovada">Aprovadas</option>
            <option value="recusada">Recusadas</option>
            <option value="">Todas</option>
          </select>
        </div>
      </div>
      <div id="lista-instituicoes" class="tabela-wrap"></div>
    </section>

    <section data-secao="doacoes" class="painel escondido">
      <h2>Todas as doações</h2>
      <div class="filtros">
        <div>
          <label for="filtro-doacoes">Status</label>
          <select id="filtro-doacoes">
            <option value="">Todas</option>
            <option value="disponivel">Disponíveis</option>
            <option value="reservada">Reservadas</option>
            <option value="retirada">Retiradas</option>
            <option value="expirada">Expiradas</option>
          </select>
        </div>
      </div>
      <div id="lista-doacoes" class="tabela-wrap"></div>
    </section>

    <section data-secao="categorias" class="painel escondido">
      <h2>Categorias de alimento</h2>
      <form id="form-categoria" class="filtros" novalidate>
        <div>
          <label for="nome-categoria">Nova categoria</label>
          <input id="nome-categoria" type="text" maxlength="80" placeholder="Ex.: Congelados">
        </div>
        <div style="flex: 0 0 auto;"><button class="btn" type="submit">Adicionar</button></div>
      </form>
      <div id="lista-categorias" class="tabela-wrap"></div>
    </section>

    <section data-secao="usuarios" class="painel escondido">
      <h2>Usuários</h2>
      <div id="lista-usuarios" class="tabela-wrap"></div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
